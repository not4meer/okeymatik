<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Okeymatik</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b1120;color:#cbd5e1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{text-align:center;max-width:400px}
    .logo-icon{width:80px;height:80px;background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px}
    h1{font-size:32px;font-weight:700;color:#f1f5f9;margin-bottom:8px}
    .sub{color:#64748b;margin-bottom:40px;font-size:15px}
    .links{display:flex;flex-direction:column;gap:12px}
    a{display:block;background:#111827;border:1px solid #1e293b;border-radius:12px;padding:16px 24px;color:#e2e8f0;text-decoration:none;font-size:15px;font-weight:500;transition:border-color .15s}
    a:hover{border-color:#3b82f6;color:#93c5fd}
    .foot{color:#334155;font-size:13px;margin-top:40px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo-icon">🀱</div>
  <h1>Okeymatik</h1>
  <p class="sub">Masa çevresinde skor & kural asistanı</p>
  <div class="links">
    <a href="privacy.html">🔒 Gizlilik Politikası</a>
    <a href="terms.html">📄 Kullanım Koşulları</a>
  </div>
  <p class="foot">© 2025 Okeymatik</p>
</div>
</body>
</html>
