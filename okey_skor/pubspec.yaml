name: okey_skor
description: Okey ve Okey 101 skor hesaplama ve kural asistanı
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.8
  http: ^1.2.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  firebase_core: ^3.13.1
  firebase_database: ^11.3.5
  screenshot: ^3.0.0
  path_provider: ^2.1.0
  google_fonts: ^8.1.0
  unity_ads_plugin: ^0.3.20
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.0
  in_app_review: ^2.0.9
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1A0E56"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/rules/
    - assets/images/
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Caveat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700
